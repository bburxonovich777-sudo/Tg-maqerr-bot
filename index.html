<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Bot Maker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0a0b;
    --surface-1: #131315;
    --surface-2: #1b1b1e;
    --surface-3: #252529;
    --border: #2c2c31;
    --border-strong: #3e3e46;
    --text: #f4f4f5;
    --muted: #8d8d95;
    --white: #ffffff;
    --black: #0a0a0b;
    --r-xl: 26px;
    --r-lg: 20px;
    --r-md: 16px;
    --r-sm: 12px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-top: calc(12px + var(--safe-top));
    padding-bottom: calc(92px + var(--safe-bottom));
    background-image:
      radial-gradient(ellipse 80% 45% at 50% -10%, rgba(255, 255, 255, 0.055), transparent 70%),
      radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.025), transparent 50%);
  }

  .app-shell {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Typography & Numbers */
  .num {
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .page-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 22px 0 12px;
  }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* Cards & Surfaces */
  .card {
    background: linear-gradient(180deg, rgba(27, 27, 30, 0.92) 0%, rgba(19, 19, 21, 0.98) 100%);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .card + .card {
    margin-top: 12px;
  }

  .hero-balance {
    position: relative;
    overflow: hidden;
    border-radius: var(--r-xl);
    padding: 22px 20px;
    background:
      radial-gradient(120% 100% at 100% 0%, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.02) 45%, transparent 75%),
      linear-gradient(145deg, #1f1f24 0%, #121214 60%, #0d0d0f 100%);
    border: 1px solid var(--border-strong);
    box-shadow:
      0 18px 42px rgba(0, 0, 0, 0.55),
      0 0 40px rgba(255, 255, 255, 0.035),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }

  .hero-balance::after {
    content: "";
    position: absolute;
    top: -40px;
    right: -40px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.14), transparent 70%);
    pointer-events: none;
  }

  .balance-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
  }

  .balance-amount {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.08;
    color: var(--white);
  }

  .balance-unit {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    margin-left: 4px;
  }

  /* Header Greeting */
  .top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 15px;
    background: linear-gradient(145deg, #2b2b30, #17171a);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
    color: var(--white);
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .avatar-lg {
    width: 64px;
    height: 64px;
    border-radius: 22px;
    font-size: 24px;
  }

  .greeting-text {
    min-width: 0;
  }

  .greeting-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .greeting-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid transparent;
    border-radius: var(--r-md);
    padding: 13px 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.14s ease, background-color 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    user-select: none;
  }

  .btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-block {
    width: 100%;
  }

  .btn-sm {
    padding: 9px 14px;
    font-size: 13px;
    border-radius: var(--r-sm);
  }

  .btn-primary {
    background: var(--white);
    color: var(--black);
    box-shadow: 0 6px 18px rgba(255, 255, 255, 0.12);
  }

  .btn-primary:active:not(:disabled) {
    background: #e4e4e7;
  }

  .btn-secondary {
    background: var(--surface-3);
    color: var(--text);
    border-color: var(--border-strong);
  }

  .btn-secondary:active:not(:disabled) {
    background: #2f2f35;
  }

  .btn-outline {
    background: transparent;
    color: var(--text);
    border-color: var(--border-strong);
  }

  .btn-outline:active:not(:disabled) {
    background: var(--surface-2);
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    border-radius: 12px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.14s ease, background-color 0.16s ease, opacity 0.16s ease;
  }

  .icon-btn:active:not(:disabled) {
    transform: scale(0.94);
    background: #323238;
  }

  .icon-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .icon-btn.primary-icon {
    background: var(--white);
    color: var(--black);
    border-color: var(--white);
  }

  /* Grid & Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 12px;
  }

  .stat-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px;
  }

  .stat-val {
    font-size: 24px;
    font-weight: 800;
    margin-top: 6px;
    color: var(--white);
  }

  /* Shortcut Banner */
  .shortcut-card {
    margin-top: 12px;
    padding: 16px 18px;
    border-radius: var(--r-lg);
    background: linear-gradient(135deg, #1d1d21 0%, #141416 100%);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.14s ease, border-color 0.18s ease;
  }

  .shortcut-card:active {
    transform: scale(0.985);
    border-color: #52525b;
  }

  .shortcut-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .shortcut-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: var(--white);
    color: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Referral Card */
  .ref-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 14px 0;
    padding: 12px;
    border-radius: var(--r-md);
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .ref-cell {
    text-align: center;
  }

  .ref-cell-val {
    font-size: 16px;
    font-weight: 800;
    color: var(--white);
  }

  .ref-cell-lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  /* Template & Bot Lists */
  .list-item {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform 0.14s ease, border-color 0.18s ease, background-color 0.18s ease;
  }

  .list-item + .list-item {
    margin-top: 10px;
  }

  .list-item:active {
    transform: scale(0.985);
    background: var(--surface-2);
    border-color: var(--border-strong);
  }

  .list-body {
    flex: 1;
    min-width: 0;
  }

  .list-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.015em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .price-pill {
    padding: 7px 11px;
    border-radius: 12px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* My Bots Card */
  .bot-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 16px;
    cursor: pointer;
    transition: transform 0.14s ease, border-color 0.18s ease;
  }

  .bot-card + .bot-card {
    margin-top: 10px;
  }

  .bot-card:active {
    transform: scale(0.985);
    border-color: var(--border-strong);
  }

  .bot-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .bot-ident {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status-dot.on {
    background: var(--white);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  }

  .status-dot.off {
    background: transparent;
    border: 2px solid var(--muted);
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--text);
    white-space: nowrap;
  }

  .badge.muted {
    color: var(--muted);
    background: var(--surface-2);
    border-color: var(--border);
  }

  .progress-wrap {
    margin-top: 14px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 5px;
    width: 100%;
    border-radius: 999px;
    background: var(--surface-3);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #a1a1aa, #ffffff);
    transition: width 0.3s ease;
  }

  /* Inputs & Chips */
  .field {
    margin-top: 14px;
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 13px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .input::placeholder {
    color: #5c5c64;
  }

  .input:focus {
    border-color: var(--white);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .input-row .input {
    flex: 1;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .chip {
    padding: 9px 13px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .chip.active {
    background: var(--white);
    color: var(--black);
    border-color: var(--white);
  }

  .chip:active {
    transform: scale(0.96);
  }

  /* Wallet Transactions */
  .tx-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }

  .tx-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .tx-item:first-child {
    padding-top: 0;
  }

  .tx-note {
    font-size: 14px;
    font-weight: 600;
  }

  .tx-date {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .tx-amount {
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
  }

  .tx-amount.plus {
    color: var(--white);
  }

  .tx-amount.minus {
    color: var(--muted);
  }

  /* Copy Box */
  .copy-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 12px 14px;
    margin-top: 8px;
  }

  .copy-val {
    font-size: 15px;
    font-weight: 700;
    word-break: break-all;
  }

  /* Profile Rows */
  .kv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }

  .kv-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .kv-row:first-child {
    padding-top: 0;
  }

  .kv-key {
    color: var(--muted);
  }

  .kv-val {
    font-weight: 700;
  }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;
    background: rgba(13, 13, 15, 0.84);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 8px calc(8px + var(--safe-bottom));
  }

  .nav-inner {
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 2px;
  }

  .nav-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    padding: 6px 2px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: color 0.16s ease, transform 0.14s ease;
  }

  .nav-btn:active {
    transform: scale(0.93);
  }

  .nav-btn.active {
    color: var(--white);
  }

  .nav-btn svg {
    width: 21px;
    height: 21px;
    stroke-width: 1.9;
  }

  /* Bottom Sheet */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .sheet-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .sheet-panel {
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--surface-1);
    border-top: 1px solid var(--border-strong);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-radius: 28px 28px 0 0;
    padding: 12px 18px calc(24px + var(--safe-bottom));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.7);
  }

  .sheet-backdrop.open .sheet-panel {
    transform: translateY(0);
  }

  .sheet-grabber {
    width: 38px;
    height: 4px;
    border-radius: 999px;
    background: var(--border-strong);
    margin: 0 auto 14px;
  }

  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .sheet-title {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: 50%;
    transform: translate(-50%, -140%);
    z-index: 90;
    max-width: calc(100% - 32px);
    width: max-content;
    background: var(--surface-3);
    color: var(--white);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }

  .toast.show {
    transform: translate(-50%, 0);
  }

  /* Gate / Empty / Error / Skeleton */
  .center-screen {
    min-height: calc(100vh - 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 8px;
  }

  .gate-logo {
    width: 72px;
    height: 72px;
    border-radius: 24px;
    background: linear-gradient(145deg, #27272c, #141417);
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  .gate-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }

  .gate-desc {
    font-size: 14.5px;
    color: var(--muted);
    max-width: 320px;
    margin-bottom: 24px;
  }

  .gate-hint {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 14px;
    max-width: 300px;
  }

  .empty-box {
    text-align: center;
    padding: 36px 20px;
    background: var(--surface-1);
    border: 1px dashed var(--border-strong);
    border-radius: var(--r-lg);
  }

  .empty-title {
    font-size: 16px;
    font-weight: 700;
    margin-top: 10px;
  }

  .empty-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 0 16px;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--surface-1) 25%, var(--surface-2) 50%, var(--surface-1) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.3s infinite linear;
    border-radius: var(--r-lg);
    height: 84px;
    border: 1px solid var(--border);
  }

  .skeleton + .skeleton {
    margin-top: 10px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .demo-pill {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--surface-3);
    border: 1px solid var(--border-strong);
    color: var(--muted);
  }

  .hidden {

      const b = mockDB.bots[idx];
      if (body.act === "pause") b.active = false;
      if (body.act === "resume" || body.act === "restart") b.active = true;
      if (body.act === "delete") mockDB.bots.splice(idx, 1);
      if (body.act === "extend") {
        const plan = (b.plans || []).find((p) => p.m === body.months) || { m: 1, p: 25000 };
        if (mockDB.me.balance < plan.p) return { ok: false, err: state.lang === "ru" ? "Недостаточно средств" : "Mablag‘ yetarli emas" };
        mockDB.me.balance -= plan.p;
        b.left += plan.m * 30;
        b.trial = false;
        mockDB.tx.unshift({ a: -plan.p, n: `${b.username} (+${plan.m} oy)`, d: "Hozir" });
      }
      return { ok: true };
    }
    if (name === "wallet") return { ok: true, tx: mockDB.tx };
    if (name === "topup/start") {
      const amt = Math.max(1000, Number(body.amount) || 10000) + Math.floor(Math.random() * 90 + 10);
      return { ok: true, pid: "PAY-" + Date.now(), amount: amt, card: "8600 1204 8890 4412" };
    }
    if (name === "topup/receipt") return { ok: true };
    if (name === "topup/invoice") return { ok: true, link: "https://t.me/$demo_invoice" };
    if (name === "promo") {
      if (!body.code) return { ok: false, err: "Kod noto‘g‘ri" };
      mockDB.me.balance += 10000;
      mockDB.tx.unshift({ a: 10000, n: `Promokod: ${body.code}`, d: "Hozir" });
      return { ok: true, amount: 10000 };
    }
    if (name === "lang") {
      mockDB.me.lang = body.lang;
      return { ok: true };
    }
    if (name === "admin/stats") return { ok: true, s: mockDB.adminStats };
    if (name === "admin/payments") return { ok: true, items: mockDB.adminPayments };
    if (name === "admin/pay") {
      mockDB.adminPayments = mockDB.adminPayments.filter((p) => p.id !== body.id);
      return { ok: true };
    }
    if (name === "admin/bots") return { ok: true, items: mockDB.adminBots };
    if (name === "admin/delbot") {
      mockDB.adminBots = mockDB.adminBots.filter((b) => b.id !== body.id);
      return { ok: true };
    }
    return { ok: false, err: "server" };
  }

  // API Client
  async function api(name, body = {}, opts = {}) {
    if (state.demo) {
      return mockApi(name, body);
    }
    if (!state.api) {
      throw new Error("NO_API");
    }
    let res;
    try {
      res = await fetch(`${state.api}/api/${name}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Init-Data": tg && tg.initData ? tg.initData : "",
          "ngrok-skip-browser-warning": "1"
        },
        body: JSON.stringify(body)
      });
    } catch (_) {
      if (!opts.silent) showToast(t("no_conn"));
      throw new Error("NETWORK");
    }

    let data;
    try {
      data = await res.json();
    } catch (_) {
      if (!opts.silent) showToast(t("err_server"));
      throw new Error("SERVER");
    }

    if (!data || data.ok !== true) {
      const code = data && data.err ? String(data.err) : "server";
      const map = {
        auth: t("err_auth"),
        forbidden: t("err_forbidden"),
        rate: t("err_rate"),
        server: t("err_server")
      };
      const msg = map[code] || code || t("err_generic");
      if (!opts.silent) {
        haptic("error");
        showToast(msg);
      }
      throw new Error(msg);
    }
    return data;
  }

  // Button lock helper against double submits
  async function withLock(btn, fn) {
    if (!btn || btn.disabled) return;
    const prev = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = "…";
    try {
      await fn();
    } finally {
      if (document.body.contains(btn)) {
        btn.disabled = false;
        btn.innerHTML = prev;
      }
    }
  }

  // Resize image file to JPEG data URL (max 1280px side, quality 0.82)
  function resizeReceiptToJpeg(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("READ_ERR"));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("IMG_ERR"));
        img.onload = () => {
          const maxSide = 1280;
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxSide || h > maxSide) {
            if (w >= h) {
              h = Math.round((h * maxSide) / w);
              w = maxSide;
            } else {
              w = Math.round((w * maxSide) / h);
              h = maxSide;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Topup Flow Sheet
  function openTopupSheet() {
    const presets = [5000, 10000, 20000, 50000, 100000];
    openSheet(t("topup_title"), `
      <div class="field" style="margin-top:0;">
        <label class="field-label" for="topupAmtInput">${esc(t("amount_lbl"))}</label>
        <input id="topupAmtInput" class="input num" type="number" inputmode="numeric" min="1000" value="10000" />
        <div id="amtChips" class="chips">
          ${presets.map((v) => `
            <button type="button" class="chip num ${v === 10000 ? "active" : ""}" data-v="${v}">${esc(fmtNum(v))}</button>
          `).join("")}
        </div>
      </div>
      <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px;">
        <button id="topupCardBtn" type="button" class="btn btn-primary btn-block">${esc(t("by_card"))}</button>
        ${state.me && state.me.invoice ? `<button id="topupInvBtn" type="button" class="btn btn-secondary btn-block">${esc(t("by_invoice"))}</button>` : ""}
      </div>
    `);

    const amtInput = document.getElementById("topupAmtInput");
    sheetBodyEl.querySelectorAll("#amtChips .chip").forEach((ch) => {
      ch.addEventListener("click", () => {
        haptic("light");
        sheetBodyEl.querySelectorAll("#amtChips .chip").forEach((c) => c.classList.remove("active"));
        ch.classList.add("active");
        amtInput.value = ch.dataset.v;
      });
    });

    function getValidAmount() {
      const val = Math.floor(Number(amtInput.value) || 0);
      if (val < 1000) {
        haptic("warning");
        showToast(t("min_amount"));
        return null;
      }
      return val;
    }

    const cardBtn = document.getElementById("topupCardBtn");
    cardBtn.addEventListener("click", () => {
      const amount = getValidAmount();
      if (!amount) return;
      withLock(cardBtn, async () => {
        try {
          const res = await api("topup/start", { amount });
          renderCardTransferStep(res);
        } catch (_) {}
      });
    });

    const invBtn = document.getElementById("topupInvBtn");
    if (invBtn) {
      invBtn.addEventListener("click", () => {
        const amount = getValidAmount();
        if (!amount) return;
        withLock(invBtn, async () => {
          try {
            const res = await api("topup/invoice", { amount });
            if (tg && typeof tg.openInvoice === "function" && !state.demo) {
              tg.openInvoice(res.link, async (status) => {
                if (status === "paid") {
                  haptic("success");
                  closeSheet();
                  showToast(t("paid_ok"));
                  await refreshMe(true);
                  render();
                }
              });
            } else {
              haptic("success");
              closeSheet();
              showToast(t("paid_ok"));
              await refreshMe(true);
              render();
            }
          } catch (_) {}
        });
      });
    }
  }

  function renderCardTransferStep(info) {
    let photoDataUrl = null;
    sheetTitleEl.textContent = t("by_card");
    sheetBodyEl.innerHTML = `
      <div class="field" style="margin-top:0;">
        <span class="field-label">${esc(t("transfer_exact"))}</span>
        <div class="copy-box">
          <span class="copy-val num">${esc(fmtNum(info.amount))} ${esc(t("sum"))}</span>
          <button id="copyExactAmt" type="button" class="btn btn-secondary btn-sm">${esc(t("copy"))}</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">${esc(t("card_number"))}</span>
        <div class="copy-box">
          <span class="copy-val num">${esc(info.card)}</span>
          <button id="copyCardNum" type="button" class="btn btn-secondary btn-sm">${esc(t("copy"))}</button>
        </div>
      </div>

      <div class="field">
        <input id="receiptFileInput" type="file" accept="image/*" class="hidden" />
        <button id="pickPhotoBtn" type="button" class="btn btn-outline btn-block">${esc(t("pick_photo"))}</button>
      </div>

      <div style="margin-top:14px;">
        <button id="sendReceiptBtn" type="button" class="btn btn-primary btn-block" disabled>${esc(t("send_receipt"))}</button>
      </div>
    `;

    document.getElementById("copyExactAmt").addEventListener("click", () => copyText(String(info.amount)));
    document.getElementById("copyCardNum").addEventListener("click", () => copyText(String(info.card)));

    const fileInput = document.getElementById("receiptFileInput");
    const pickBtn = document.getElementById("pickPhotoBtn");
    const sendBtn = document.getElementById("sendReceiptBtn");

    pickBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      pickBtn.disabled = true;
      pickBtn.textContent = "…";
      try {
        photoDataUrl = await resizeReceiptToJpeg(file);
        pickBtn.textContent = t("photo_picked");
        sendBtn.disabled = false;
        haptic("light");
      } catch (_) {
        showToast(t("err_generic"));
        pickBtn.textContent = t("pick_photo");
      } finally {
        pickBtn.disabled = false;
      }
    });

    sendBtn.addEventListener("click", () => {
      if (!photoDataUrl) return;
      withLock(sendBtn, async () => {
        try {
          await api("topup/receipt", { pid: info.pid, photo: photoDataUrl });
          haptic("success");
          closeSheet();
          showToast(t("receipt_sent"));
          render();
        } catch (_) {}
      });
    });
  }

  // Screen: Admin (only when me.admin is true)
  async function renderAdmin(app) {
    app.innerHTML = `<h1 class="page-title">${esc(t("admin_title"))}</h1><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
    let st, pays, bots;
    try {
      const [r1, r2, r3] = await Promise.all([
        api("admin/stats"),
        api("admin/payments"),
        api("admin/bots")
      ]);
      st = r1.s || {};
      pays = r2.items || [];
      bots = r3.items || [];
    } catch (err) {
      app.innerHTML = renderErrorBox(err.message);
      bindRetry(app);
      return;
    }

    app.innerHTML = `
      <h1 class="page-title">${esc(t("admin_title"))}</h1>

      <div class="stats-grid" style="margin-top:0;">
        <div class="stat-card">
          <div class="eyebrow">${esc(t("st_users"))}</div>
          <div class="stat-val num">${esc(fmtNum(st.users))}</div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">${esc(t("st_bots"))}</div>
          <div class="stat-val num">${esc(fmtNum(st.bots))}</div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">${esc(t("st_active"))}</div>
          <div class="stat-val num">${esc(fmtNum(st.active))}</div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">${esc(t("st_today"))}</div>
          <div class="stat-val num">${esc(fmtNum(st.rev_today))}</div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">${esc(t("st_week"))}</div>
          <div class="stat-val num">${esc(fmtNum(st.rev_week))}</div>
        </div>
        <div class="stat-card">
          <div class="eyebrow">${esc(t("st_all"))}</div>
          <div class="stat-val num">${esc(fmtNum(st.rev_all))}</div>
        </div>
      </div>

      <div class="section-head">
        <div class="section-title">${esc(t("pending_pays"))}</div>
      </div>
      ${pays.length ? pays.map((p) => `
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div style="min-width:0;">
            <div class="list-title num">${esc(fmtNum(p.amount))} ${esc(t("sum"))}</div>
            <div class="list-sub">${esc(p.name)} · ${esc(p.phone)}</div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            <button type="button" class="icon-btn primary-icon pay-act" data-id="${esc(p.id)}" data-ok="1" aria-label="Tasdiqlash">${ICONS.check}</button>
            <button type="button" class="icon-btn pay-act" data-id="${esc(p.id)}" data-ok="0" aria-label="Rad etish">${ICONS.close}</button>

      <div class="section-head">
        <div class="section-title">${esc(t("all_bots"))}</div>
      </div>
      ${bots.length ? bots.map((b) => `
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <div style="min-width:0;">

            await api("admin/pay", { id, ok });
            haptic("success");
            showToast(t("done"));
            render();
          } catch (_) {}
        });
      });
    });

    app.querySelectorAll(".adm-del-bot").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id) || btn.dataset.id;
        haptic("warning");
        const proceed = () => {
          withLock(btn, async () => {
            try {
              await api("admin/delbot", { id });
              haptic("success");
              showToast(t("done"));
              render();
            } catch (_) {}
          });
        };
        if (tg && typeof tg.showConfirm === "function") {
          tg.showConfirm(t("confirm_del_bot"), (ok) => { if (ok) proceed(); });
        } else if (window.confirm(t("confirm_del_bot"))) {
          proceed();
        }
      });
    });

  // Friendly Error Box + Retry
  function renderErrorBox(msg) {
    return `
      <div class="empty-box" style="margin-top:24px;">
        <div class="empty-title">${esc(msg || t("no_conn"))}</div>
        <div class="empty-desc"></div>
        <button id="retryBtn" type="button" class="btn btn-primary btn-sm">${esc(t("retry"))}</button>
      </div>
    `;
  }

  function bindRetry(container) {
    const btn = container.querySelector("#retryBtn");
    if (btn) {
      btn.addEventListener("click", () => {
        haptic("light");
        if (!state.me) {
          boot();
        } else {
          render();
        }
      });
    }
  }

  // Main Router / Render
  function render() {
    const app = document.getElementById("app");
    renderNav();

    if (!state.me) {
      app.innerHTML = `<div class="skeleton" style="height:140px;"></div><div class="skeleton"></div><div class="skeleton"></div>`;
      return;
    }

    if (!state.me.verified) {
      renderGate(app);
      return;
    }

    if (state.tab === "admin" && !state.me.admin) {
      state.tab = "home";
    }

    if (state.tab === "home") renderHome(app);
    else if (state.tab === "shop") renderShop(app);
    else if (state.tab === "bots") renderBots(app);
    else if (state.tab === "wallet") renderWallet(app);
    else if (state.tab === "profile") renderProfile(app);
    else if (state.tab === "admin") renderAdmin(app);
  }

  // App Boot
  async function boot() {
    const app = document.getElementById("app");
    if (!state.api && !state.demo) {
      app.innerHTML = `
        <div class="center-screen">
          <div class="gate-logo">${ICONS.botLogo}</div>
          <h1 class="gate-title">${esc(t("api_missing_title"))}</h1>
          <p class="gate-desc">${esc(t("api_missing_desc"))}</p>
        </div>
      `;
      return;
    }

    app.innerHTML = `<div class="skeleton" style="height:140px;"></div><div class="skeleton"></div><div class="skeleton"></div>`;
    try {
      await refreshMe(true);
      render();
    } catch (err) {
      app.innerHTML = renderErrorBox(err.message === "NETWORK" ? t("no_conn") : err.message);
      bindRetry(app);
    }
  }

  initApiBase();
  boot();
})();
</script>
